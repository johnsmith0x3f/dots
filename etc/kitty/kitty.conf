# Kitty Configuration (handmade by @johnsmith0x3f)
# Reference = https://sw.kovidgoyal.net/kitty/conf

# Include the colorscheme.
include themes/tokyonight-storm.conf



# Section = Fonts
# URL = https://sw.kovidgoyal.net/kitty/conf/#fonts

# Set font family and features.
font_family family="Maple Mono NFMono CN" features="-calt +cv01 +cv02"

# Set font size.
font_size 15



# Section = Terminal Bell
# URL = https://sw.kovidgoyal.net/kitty/conf/#terminal-bell

# Silence is gold.
enable_audio_bell no



# Section = Window Layout
# URL = https://sw.kovidgoyal.net/kitty/conf/#window-layout

# Do not remember window size.
remember_window_size no

# Default window size (in cells).
initial_window_width 80c
initial_window_height 24c

# Padding outside each window.
window_padding_width 36



# Section = Tab Bar
# URL = https://sw.kovidgoyal.net/kitty/conf/#tab-bar

# Tab bar location.
tab_bar_edge top

# Style of tabs.
tab_bar_style slant

# Minimum number of tabs for the tab bar to show.
tab_bar_min_tabs 1

# Custom tab title format.
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{index} {title}"



# Section = Keyboard Shortcuts
# URL = https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts

# Remove default mappings.
clear_all_shortcuts yes



# Section = Mappable Actions:Copy Paste
# URL = https://sw.kovidgoyal.net/kitty/actions/#copy-paste

# Basic copy/paste.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# Section = Mappable Actions:Miscellaneous
# URL = https://sw.kovidgoyal.net/kitty/actions/#miscellaneous

# Send a literal prefix key.
map ctrl+a>ctrl+a send_key ctrl+a

# Edit config file in $EDITOR.
map ctrl+a>ctrl+e edit_config_file

# Reload config file.
map ctrl+a>ctrl+r load_config_file



# Section = Mappable Actions:Tab Management
# URL = https://sw.kovidgoyal.net/kitty/actions/#tab-management

# Close current tab.
map ctrl+a>ctrl+x close_tab

# Go to specified tab.
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

# Move current tab around.
map ctrl+a>n move_tab_forward
map ctrl+a>b move_tab_backward

# Create a new tab.
map ctrl+a>ctrl+c new_tab

# Focus next/previous tab.
map ctrl+a>ctrl+n next_tab
map ctrl+a>ctrl+b previous_tab

# Change the title of current tab interactively.
map ctrl+a>t set_tab_title



# Section = Mappable Actions:Window Management
# URL = https://sw.kovidgoyal.net/kitty/actions/#window-management

# Change the window (pane) title interactively.
map ctrl+a>ctrl+t set_window_title

# Display a number in each window, focus desired window by typing its number.
map ctrl+a>ctrl+f focus_visible_window

# Move the current window in the specified direction.
map ctrl+a>h move_window left
map ctrl+a>j move_window down
map ctrl+a>k move_window up
map ctrl+a>l move_window right

# Focus the neighboring window in the specified direction.
map ctrl+a>ctrl+h neighboring_window left
map ctrl+a>ctrl+j neighboring_window down
map ctrl+a>ctrl+k neighboring_window up
map ctrl+a>ctrl+l neighboring_window right

# Display a number in each window, swap current window with desired window by typing its number.
map ctrl+a>ctrl+f swap_with_window

# Open a new window with the same working directory as the current window.
map ctrl+a>ctrl+v new_window_with_cwd
